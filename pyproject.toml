[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storage-interface"
version = "0.1.0"
description = "One async Python interface for many cloud storage services (Google Drive, Telegram, ...)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gdrive = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
]
telegram = ["telethon>=1.34"]
all = ["storage-interface[gdrive,telegram]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/storage_interface"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
